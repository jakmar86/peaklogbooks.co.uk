   .bindPopup(`<div class="pb">No. ${p.num}</div><div class="pn">${p.name}</div><hr class="pd"><div class="pm"><strong>${p.height}m</strong> &middot; ${p.region}<br>OS Grid: ${p.grid}</div><a href="munros/${p.num}-${p.slug}.html" class="vp">View full page &rarr;</a>`)
   .addTo(map);
});
</script>
</body>
